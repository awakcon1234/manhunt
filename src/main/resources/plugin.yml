name: LunaManhunt
version: ${version}
main: dev.belikhun.lunamanhunt.LunaManhuntPlugin
api-version: "1.21"
author: Belikhun
depend:
  - Multiverse-Core
  - Multiverse-NetherPortals
  - FancyHolograms
softdepend:
  - PlaceholderAPI

commands:
  match:
    description: "Lệnh phòng đấu LunaManhunt"
    usage: "/match help"
  lm:
    description: "Lệnh quản trị LunaManhunt"
    usage: "/lm help"
    aliases: ["manhunt", "hunt", "mh"]
  spawn:
    description: "Dịch chuyển về sảnh"
    usage: "/spawn"
  cards:
    description: "Quản lý thẻ bài"
    usage: "/cards"
    aliases: ["c"]
  compass:
    description: "Lấy lại la bàn truy tìm"
    usage: "/compass"
    aliases: ["tracker"]
  back:
    description: "Quay về điểm tử vong trước đó của thợ săn"
    usage: "/back"
  holo:
    description: "Quản lý hologram xếp hạng"
    usage: "/holo timerecords <action>"

permissions:
  lunamanhunt.match:
    description: "Toàn quyền lệnh phòng đấu"
    default: op
  lunamanhunt.match.create:
    default: true
  lunamanhunt.match.join:
    default: true
  lunamanhunt.match.invite:
    default: true
  lunamanhunt.match.start:
    default: true
  lunamanhunt.match.leave:
    default: true
  lunamanhunt.match.help:
    default: true
  lunamanhunt.match.gui:
    default: true
  lunamanhunt.match.seed:
    default: true
  lunamanhunt.match.kit:
    default: true
  lunamanhunt.admin:
    description: "Toàn quyền lệnh quản trị"
    default: op
  lunamanhunt.admin.force-stop:
    default: op
  lunamanhunt.admin.close-match:
    default: op
  lunamanhunt.admin.force-join-all:
    default: op
  lunamanhunt.admin.reload:
    default: op
  lunamanhunt.admin.setspawn:
    default: op
  lunamanhunt.admin.holo:
    default: op
  lunamanhunt.spawn:
    description: "Dịch chuyển về sảnh"
    default: true
  lunamanhunt.cards:
    description: "Xem thẻ bài"
    default: true
  lunamanhunt.cards.use:
    description: "Dùng thẻ bài"
    default: true
  lunamanhunt.compass:
    description: "Lấy lại la bàn truy tìm"
    default: true
  lunamanhunt.back:
    description: "Dùng /back về điểm tử vong"
    default: true
