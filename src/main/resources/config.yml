lobby:
  spawn:
    world: ""
    x: 0.0
    y: 0.0
    z: 0.0
    yaw: 0.0
    pitch: 0.0

match:
  defaults:
    speedrunnerSelection: RANDOM
    worldSeed: ""
    worldGenerationVersion: current
    worldTime: CYCLE
    worldWeather: CYCLE
    worldDifficulty: MEDIUM
    keepInventory: off
    worldBorderLimit: 3000
    startingBorder: 10
    visibility: PUBLIC
    speedrunnerKitId: starter
    speedrunnerKit: []

generator:
  javaCommand: "java"
  maxMemoryMb: 512
  startupTimeoutSeconds: 180
  downloadUserAgent: "luna-manhunt/1.0 (https://github.com/Belikhun/LunaManhunt)"
